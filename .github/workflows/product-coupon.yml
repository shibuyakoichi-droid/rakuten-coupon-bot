name: product-coupon

# 商品別クーポン（もっちり 20%OFF・50枚・その日限り）を対象日の朝に自動発行。
# 日本時間 08:00 に発行 → cron(UTC)は前日23:00。
#   JST 8/14,8/16,8/17,8/18 の発行 = UTC 8/13,8/15,8/16,8/17 の23:00
#   （8/13分は初日なので手動発行。スクリプト側でも issue_dates 内の日だけ発行する安全弁あり）
on:
  schedule:
    - cron: "0 23 13,15,16,17 8 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test=限定公開1枚 / issue=本番発行(手動) / testline=LINE通知だけ確認"
        required: false
        default: "test"
      config:
        description: "使用する設定ファイル（既定=product_coupon_config.json）"
        required: false
        default: "product_coupon_config.json"

concurrency:
  group: product-coupon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: pip install requests

      - name: 商品別クーポンを発行
        env:
          RAKUTEN_SERVICE_SECRET: ${{ secrets.RAKUTEN_SERVICE_SECRET }}
          RAKUTEN_LICENSE_KEY: ${{ secrets.RAKUTEN_LICENSE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          CFG="${{ github.event.inputs.config }}"
          CFG="${CFG:-product_coupon_config.json}"
          if [ "$MODE" = "test" ]; then
            python product_coupon.py --test --config "$CFG"
          elif [ "$MODE" = "testline" ]; then
            python product_coupon.py --test-line
          elif [ "$MODE" = "issue" ]; then
            python product_coupon.py --force --config "$CFG"
          else
            # スケジュール実行（cron）: 対象日チェックありの本番発行（もっちり）
            python product_coupon.py
          fi
