name: product-coupon

# 商品別クーポンの手動発行用ワークフロー。
# ※もっちり(mocchi)の自動発行スケジュールは 2026-08-15 に停止（ユーザー指示）。
#   再開する場合は下に schedule(cron) を戻す。手動発行(workflow_dispatch)はそのまま使える。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test=限定公開1枚 / issue=本番発行(手動) / testline=LINE通知だけ確認"
        required: false
        default: "test"
      config:
        description: "使用する設定ファイル（既定=product_coupon_config.json）"
        required: false
        default: "product_coupon_config.json"

concurrency:
  group: product-coupon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: pip install requests

      - name: 商品別クーポンを発行
        env:
          RAKUTEN_SERVICE_SECRET: ${{ secrets.RAKUTEN_SERVICE_SECRET }}
          RAKUTEN_LICENSE_KEY: ${{ secrets.RAKUTEN_LICENSE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          CFG="${{ github.event.inputs.config }}"
          CFG="${CFG:-product_coupon_config.json}"
          if [ "$MODE" = "test" ]; then
            python product_coupon.py --test --config "$CFG"
          elif [ "$MODE" = "testline" ]; then
            python product_coupon.py --test-line
          elif [ "$MODE" = "issue" ]; then
            python product_coupon.py --force --config "$CFG"
          else
            # スケジュール実行（cron）: 対象日チェックありの本番発行（もっちり）
            python product_coupon.py
          fi
